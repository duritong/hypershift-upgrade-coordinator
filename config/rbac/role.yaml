---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - controlplane.hypershift.openshift.io
  resources:
  - controlplanecomponents
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - upgrade.0xshift.dev
  resources:
  - hostedclusterupgrades
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - upgrade.0xshift.dev
  resources:
  - hostedclusterupgrades/finalizers
  verbs:
  - update
- apiGroups:
  - upgrade.0xshift.dev
  resources:
  - hostedclusterupgrades/status
  verbs:
  - get
  - patch
  - update
