# permissions for end users to view hostedclusterupgrades.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: hostedclusterupgrade-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: huc
    app.kubernetes.io/part-of: huc
    app.kubernetes.io/managed-by: kustomize
  name: hostedclusterupgrade-viewer-role
rules:
- apiGroups:
  - upgrade.0xshift.dev
  resources:
  - hostedclusterupgrades
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - upgrade.0xshift.dev
  resources:
  - hostedclusterupgrades/status
  verbs:
  - get
