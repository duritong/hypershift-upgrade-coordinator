apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guest-access
  namespace: system
# This is actual namespace-wide Secret authority. Prefix/label ownership is an
# application check, not an RBAC security boundary. Never make this a ClusterRole.
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch, delete]
