apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Adds namespace to all resources.
namespace: hypershift-upgrade-coordinator

# Value of this field is prepended to the names of all resources
namePrefix: huc-

resources:
- ../crd
- ../rbac
- ../manager
- ../webhook
- ../prometheus

patches:
# Protect the /metrics endpoint behind kube-rbac-proxy
- path: manager_auth_proxy_patch.yaml
# Mount the OpenShift Service CA serving certificate into manager pod
- path: manager_webhook_patch.yaml
