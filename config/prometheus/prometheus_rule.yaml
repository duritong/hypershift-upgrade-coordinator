apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypershift-upgrade-coordinator-alerts
  namespace: system
spec:
  groups:
  - name: hypershift-upgrade-coordinator.alerts
    rules:
    - alert: HypershiftUpgradeGuestCredentialUnavailable
      expr: (hypershift_upgrade_guest_credential_available == 0) and on(namespace, name) (((hypershift_upgrade_phase >= 2) and (hypershift_upgrade_phase <= 5)) or (hypershift_upgrade_phase == 7))
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Observer credential unavailable during upgrade"
        description: "HostedClusterUpgrade '{{ $labels.namespace }}/{{ $labels.name }}' lacks a reported unexpired observer credential. Inspect guestAccess and source admin kubeconfig, endpoint TLS and ownership; no admin observation fallback exists."
    - alert: HypershiftUpgradeGuestMaintenanceDegraded
      expr: (hypershift_upgrade_guest_access_maintenance_ready == 0) and on(namespace, name) (((hypershift_upgrade_phase >= 2) and (hypershift_upgrade_phase <= 5)) or (hypershift_upgrade_phase == 7))
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Observer credential maintenance degraded"
        description: "HostedClusterUpgrade '{{ $labels.namespace }}/{{ $labels.name }}' cannot maintain access. A still-valid old credential can remain usable until expiration. Inspect status.guestAccess.reason."
    - alert: HypershiftUpgradeGuestReadStale
      expr: (time() - hypershift_upgrade_guest_last_successful_observation_timestamp_seconds > 120) and on(namespace, name) (((hypershift_upgrade_phase >= 2) and (hypershift_upgrade_phase <= 5)) or (hypershift_upgrade_phase == 7))
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Scoped guest observations stale or absent"
        description: "HostedClusterUpgrade '{{ $labels.namespace }}/{{ $labels.name }}' has no recent complete scoped collection. Successful reads include unhealthy results; this alert is about read freshness, not operator health."
    - alert: HypershiftUpgradeGuestAssessmentBlocked
      expr: (hypershift_upgrade_guest_assessment{state=~"Unhealthy|Unavailable|AccessDenied|IdentityMismatch|UnsupportedEvidence|Stale|Invalidated|NotAssessed|Unknown"} == 1) and on(namespace, name) (((hypershift_upgrade_phase >= 2) and (hypershift_upgrade_phase <= 5)) or (hypershift_upgrade_phase == 7))
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Guest purpose assessment cannot pass"
        description: "HostedClusterUpgrade '{{ $labels.namespace }}/{{ $labels.name }}' reports {{ $labels.state }} for {{ $labels.purpose }} ({{ $labels.reason }}). Inspect guestAssessment; delegated rollouts are not cancelled. This does not query guest firing alerts."
    - alert: HypershiftUpgradeGuestVirtualizationBlocked
      expr: (hypershift_upgrade_guest_operator_blocker{operator="openshift-virtualization"} == 1) and on(namespace, name) (((hypershift_upgrade_phase >= 2) and (hypershift_upgrade_phase <= 5)) or (hypershift_upgrade_phase == 7))
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "OpenShift Virtualization is blocking cluster upgrade"
        description: "HostedClusterUpgrade '{{ $labels.namespace }}/{{ $labels.name }}' is blocked by OpenShift Virtualization during {{ $labels.purpose }} (reason: {{ $labels.reason }}). Inspect status.guestAssessment for details."
    - alert: HypershiftUpgradeCoordinatorBlocked
      expr: hypershift_upgrade_phase == 7
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: "Hosted Cluster Upgrade is Blocked"
        description: "The HostedClusterUpgrade '{{ $labels.name }}' in namespace '{{ $labels.namespace }}' is currently in Blocked phase."
    - alert: HypershiftUpgradeCoordinatorNodePoolStuck
      expr: hypershift_upgrade_nodepool_blocked == 1
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "Hosted Cluster Upgrade NodePool is Blocked"
        description: "The NodePool '{{ $labels.nodepool }}' in HostedClusterUpgrade '{{ $labels.name }}' reports an assessment or orchestration blocker. Inspect NodePool status; this is not attribution of HCCO drain logs."
    - alert: HypershiftUpgradeDrainObservations
      expr: hypershift_upgrade_drain_observations > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Cluster-level drain or eviction log observations"
        description: "HostedClusterUpgrade '{{ $labels.name }}' has recent best-effort HCCO drain hints. Inspect status.drainDiagnostics and guest resources; NodePool and PDB ownership are not established."
    - alert: HypershiftUpgradeDrainDiagnosticsUnavailable
      expr: hypershift_upgrade_drain_diagnostics_available == 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Drain log diagnostics unavailable"
        description: "HostedClusterUpgrade '{{ $labels.name }}' cannot collect best-effort HCCO diagnostics. Rollout actions continue; missing logs do not establish drain health."
    - alert: HypershiftUpgradeStepDurationLong
      expr: hypershift_upgrade_step_duration_seconds > 14400
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Hosted Cluster Upgrade step took too long"
        description: "The upgrade step '{{ $labels.step }}' for HostedClusterUpgrade '{{ $labels.name }}' has been active for more than 4 hours."
