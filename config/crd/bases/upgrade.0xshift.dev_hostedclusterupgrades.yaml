---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: hostedclusterupgrades.upgrade.0xshift.dev
spec:
  group: upgrade.0xshift.dev
  names:
    kind: HostedClusterUpgrade
    listKind: HostedClusterUpgradeList
    plural: hostedclusterupgrades
    singular: hostedclusterupgrade
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Current phase of the upgrade state machine
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Total worker nodes updated
      jsonPath: .status.aggregatedNodeStatus.updated
      name: Nodes-Updated
      type: integer
    - description: Total worker nodes in cluster
      jsonPath: .status.aggregatedNodeStatus.total
      name: Nodes-Total
      type: integer
    - description: Target OpenShift release image
      jsonPath: .spec.targetReleaseImage
      name: Target-Image
      type: string
    - description: Current status message
      jsonPath: .status.message
      name: Status-Message
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HostedClusterUpgrade is the Schema for the hostedclusterupgrades
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HostedClusterUpgradeSpec defines the desired state of HostedClusterUpgrade
            properties:
              controlPlane:
                description: |-
                  ControlPlane defines the scheduling details for upgrading the Hosted Control Plane (HCP).
                  Since CP upgrades are typically non-disruptive to user workloads, SREs can schedule
                  this stage immediately or during regular business hours.
                properties:
                  startAt:
                    description: |-
                      StartAt is an RFC3339 timestamp indicating the earliest time the control plane upgrade may begin.
                      If omitted or nil, the control plane upgrade starts immediately when the CR is reconciled and preflight checks pass.
                    format: date-time
                    type: string
                type: object
              intermediateReleaseImage:
                description: |-
                  IntermediateReleaseImage is the single optional OCP release payload image that the control plane
                  must jump through before upgrading to the TargetReleaseImage.
                  Used for EUS (Extended Update Support) intermediate hops (e.g., 4.12 -> 4.13 -> 4.14).
                  If omitted, the upgrade proceeds as a standard direct upgrade (e.g., 4.13 -> 4.14).
                  Must match pattern: registry.domain.com/path:version-arch@sha256:digest
                pattern: ^(\S+)/(\S+):([0-9]+\.[0-9]+\.[0-9]+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*)@sha256:([a-fA-F0-9]{64})$
                type: string
              nodePoolGroups:
                description: |-
                  NodePoolGroups lists the sequential rollout groups and their maintenance window start schedules.
                  First groups in this list upgrade first. Un-labeled NodePools belong to the "default" group.
                items:
                  properties:
                    name:
                      description: Name specifies the exact name of the NodePool group
                        (defined by label upgrade.huc.0xshift.dev/group on individual
                        NodePools).
                      minLength: 1
                      type: string
                    startAt:
                      description: |-
                        StartAt is an RFC3339 timestamp indicating the earliest time this specific NodePool group upgrade may begin.
                        If omitted or nil, the NodePool group upgrade begins immediately once:
                          1. Its position in the ordered list is active (all prior groups completed).
                          2. The control plane upgrade has been fully completed and verified.
                      format: date-time
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              pausedUntil:
                description: |-
                  PausedUntil can be used to pause reconciliation on this upgrade coordinator.
                  If set to "true" or "True", reconciliation is paused indefinitely (observe-only mode).
                  If set to an RFC3339 timestamp, reconciliation is paused until that time is reached.
                  If set to "false" or "False", empty, or omitted, reconciliation proceeds normally.
                type: string
              rolloutPolicy:
                description: RolloutPolicy defines global constraints on the upgrade
                  execution.
                properties:
                  maxParallelNodePools:
                    default: 1
                    description: |-
                      MaxParallelNodePools specifies the maximum number of NodePools that can be
                      upgraded in parallel within the same priority group.
                      Defaults to 1 when omitted in JSON. A zero Go value is omitted by omitempty;
                      an explicit JSON zero or a provided zero policy in direct validation is invalid.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              targetReleaseImage:
                description: |-
                  TargetReleaseImage is the final desired OpenShift release payload image.
                  Must match pattern: registry.domain.com/path:version-arch@sha256:digest
                pattern: ^(\S+)/(\S+):([0-9]+\.[0-9]+\.[0-9]+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*)@sha256:([a-fA-F0-9]{64})$
                type: string
            required:
            - controlPlane
            - targetReleaseImage
            type: object
          status:
            description: HostedClusterUpgradeStatus defines the observed state of
              HostedClusterUpgrade
            properties:
              aggregatedNodeStatus:
                description: AggregatedNodeStatus summarizes overall node upgrades
                  progress across all associated NodePools.
                properties:
                  ready:
                    description: Ready is the number of nodes that are running and
                      healthy.
                    format: int32
                    type: integer
                  total:
                    description: Total is the desired replica count.
                    format: int32
                    type: integer
                  updated:
                    description: Updated is the number of nodes running the target
                      release version.
                    format: int32
                    type: integer
                required:
                - ready
                - total
                - updated
                type: object
              completionTime:
                description: CompletionTime is the time when the upgrade successfully
                  completed.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions represents the latest available observations of the upgrade's current state.
                  Standard conditions for GitOps (e.g. ArgoCD) compatibility:
                  - Ready: True if the upgrade is fully completed.
                  - Progressing: True if an upgrade is actively being rolled out.
                  - Failing: True if an upgrade is blocked or encountering errors.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              controlPlaneStatus:
                description: ControlPlaneStatus details the progress of the Hosted
                  Control Plane upgrade.
                properties:
                  blockers:
                    description: Blockers contains messages about specific components
                      blocking the rollout.
                    items:
                      type: string
                    type: array
                  components:
                    description: Components lists the detailed status of each individual
                      control plane component.
                    items:
                      properties:
                        available:
                          description: Available reflects whether the component is
                            fully available (Available = True).
                          type: boolean
                        message:
                          description: Message is any descriptive details regarding
                            availability or rollout blocks.
                          type: string
                        name:
                          description: Name of the component (e.g., "kube-apiserver",
                            "etcd", "openshift-apiserver").
                          type: string
                        rolloutComplete:
                          description: RolloutComplete reflects whether the component
                            has finished rolling out (RolloutComplete = True).
                          type: boolean
                        version:
                          description: Version is the active version currently reported
                            by this component.
                          type: string
                      required:
                      - available
                      - name
                      - rolloutComplete
                      - version
                      type: object
                    type: array
                  scheduledStart:
                    description: ScheduledStart indicates when this step was scheduled
                      to begin (copied from spec.controlPlane.startAt).
                    format: date-time
                    type: string
                  startTime:
                    description: StartTime is when the current release hop was actuated,
                      cleared after verification.
                    format: date-time
                    type: string
                  step:
                    description: Step indicates if we are upgrading to an intermediate
                      version or the final target version.
                    type: string
                  targetReleaseImage:
                    description: TargetReleaseImage is the release image currently
                      being applied.
                    type: string
                  totalComponents:
                    description: TotalComponents is the number of control plane components
                      detected.
                    format: int32
                    type: integer
                  upgradedComponents:
                    description: UpgradedComponents is the number of control plane
                      components that have successfully completed rollout.
                    format: int32
                    type: integer
                type: object
              drainDiagnostics:
                description: |-
                  DrainDiagnostics contains best-effort cluster-level HCCO log observations,
                  not attributed NodePool blockers or proof of PDB ownership.
                properties:
                  available:
                    description: Available means log collection succeeded, not that
                      all drains are healthy.
                    type: boolean
                  messages:
                    description: Messages are recent cluster-level drain/eviction
                      hints, newest first.
                    items:
                      type: string
                    maxItems: 10
                    type: array
                  reason:
                    description: Reason is a stable collection outcome, separate from
                      rollout health.
                    type: string
                required:
                - available
                - reason
                type: object
              guestAccess:
                description: GuestAccess is owned exclusively by the guest-access
                  controller.
                properties:
                  clusterID:
                    maxLength: 64
                    type: string
                  clusterVersionUID:
                    maxLength: 64
                    type: string
                  credentialAvailable:
                    type: boolean
                  endpointRevision:
                    maxLength: 64
                    type: string
                  expiresAt:
                    format: date-time
                    type: string
                  hostedClusterUID:
                    maxLength: 64
                    type: string
                  maintenanceReady:
                    type: boolean
                  observedGeneration:
                    format: int64
                    type: integer
                  observerUsability:
                    description: ObserverUsability remains Unknown until a scoped
                      observation is performed.
                    enum:
                    - Unknown
                    - Ready
                    - Unavailable
                    - AccessDenied
                    type: string
                  profileRevision:
                    maxLength: 64
                    type: string
                  reason:
                    maxLength: 64
                    type: string
                  secretName:
                    maxLength: 253
                    type: string
                required:
                - credentialAvailable
                - maintenanceReady
                - observerUsability
                - reason
                type: object
              guestAssessment:
                description: |-
                  GuestAssessment is owned by the upgrade controller. Historical success is
                  diagnostic only; every new action requires a fresh scoped observation.
                properties:
                  blockerCount:
                    format: int32
                    type: integer
                  blockers:
                    items:
                      properties:
                        operator:
                          maxLength: 253
                          type: string
                        reason:
                          maxLength: 64
                          type: string
                      required:
                      - reason
                      type: object
                    maxItems: 32
                    type: array
                  expectedVersion:
                    maxLength: 128
                    type: string
                  hostedClusterUID:
                    maxLength: 64
                    type: string
                  lastAttemptTime:
                    format: date-time
                    type: string
                  lastSuccessfulObservation:
                    format: date-time
                    type: string
                  observedGeneration:
                    format: int64
                    type: integer
                  operators:
                    items:
                      properties:
                        name:
                          maxLength: 253
                          type: string
                        version:
                          maxLength: 128
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 256
                    type: array
                  planRevision:
                    maxLength: 64
                    type: string
                  purpose:
                    maxLength: 64
                    type: string
                  reason:
                    maxLength: 64
                    type: string
                  secretRevision:
                    maxLength: 128
                    type: string
                  secretUID:
                    maxLength: 64
                    type: string
                  state:
                    enum:
                    - Ready
                    - Converging
                    - Unhealthy
                    - Unavailable
                    - AccessDenied
                    - IdentityMismatch
                    - UnsupportedEvidence
                    type: string
                  truncated:
                    type: boolean
                  virtualization:
                    description: Virtualization is separate from the bounded ALL-current-CO
                      inventory.
                    properties:
                      name:
                        maxLength: 253
                        type: string
                      version:
                        maxLength: 128
                        type: string
                    required:
                    - name
                    type: object
                required:
                - blockerCount
                - lastAttemptTime
                - observedGeneration
                - purpose
                - reason
                - state
                - truncated
                type: object
              initialVersion:
                description: |-
                  InitialVersion is the observed source version for this upgrade run.
                  It stays stable through control-plane hops and worker rollouts.
                type: string
              message:
                description: |-
                  Message describes the current step, pending schedules, or active blocker details.
                  e.g. "Control Plane upgrade verified. NodePool 'infra-pool' is waiting for its scheduled window (opens in 14 hours)."
                type: string
              nodePoolStatuses:
                description: NodePoolStatus details the progress of each associated
                  NodePool.
                items:
                  properties:
                    blockers:
                      description: Blockers lists authoritative NodePool assessment
                        and orchestration blockers.
                      items:
                        type: string
                      type: array
                    group:
                      description: Group specifies the logical rollout group this
                        NodePool is assigned to (defined by label upgrade.huc.0xshift.dev/group).
                      type: string
                    name:
                      description: Name of the NodePool.
                      type: string
                    nodes:
                      description: Nodes contains node-level metrics for the NodePool
                        rollout.
                      properties:
                        ready:
                          description: Ready is the number of nodes that are running
                            and healthy.
                          format: int32
                          type: integer
                        total:
                          description: Total is the desired replica count.
                          format: int32
                          type: integer
                        updated:
                          description: Updated is the number of nodes running the
                            target release version.
                          format: int32
                          type: integer
                      required:
                      - ready
                      - total
                      - updated
                      type: object
                    phase:
                      description: |-
                        Phase is the current state of this specific NodePool upgrade.
                        Supported states: "Scheduled", "WaitingForGroup", "Upgrading", "Completed", "Blocked"
                      type: string
                    scheduledStart:
                      description: ScheduledStart indicates when this NodePool's group
                        is scheduled to begin upgrading (copied from spec.nodePoolGroups[].startAt).
                      format: date-time
                      type: string
                    startTime:
                      description: StartTime is when this NodePool rollout was actuated,
                        cleared after completion.
                      format: date-time
                      type: string
                    targetReleaseImage:
                      description: TargetReleaseImage is the release image currently
                        being applied to this NodePool.
                      type: string
                  required:
                  - group
                  - name
                  - nodes
                  - phase
                  - targetReleaseImage
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the coordinator.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is the current high-level state of the upgrade state machine.
                  It is absent until the upgrade writer initializes; access may report first.
                type: string
              phaseBeforeBlock:
                description: PhaseBeforeBlock is the failed step to retry without
                  restarting earlier work.
                type: string
              phaseBeforePause:
                description: PhaseBeforePause is the state to resume without restarting
                  active rollouts.
                type: string
              startTime:
                description: StartTime is the time when the upgrade actually commenced.
                format: date-time
                type: string
              workerAdmission:
                description: WorkerAdmission records compatible stage adoption, never
                  authorization.
                properties:
                  admittedAt:
                    format: date-time
                    type: string
                  clusterID:
                    maxLength: 64
                    type: string
                  hostedClusterUID:
                    maxLength: 64
                    type: string
                  hostedClusterUpgradeUID:
                    maxLength: 64
                    type: string
                  observedGeneration:
                    format: int64
                    type: integer
                  planRevision:
                    maxLength: 64
                    type: string
                  releaseRevision:
                    description: |-
                      ReleaseRevision hashes the expected version and immutable payload identity.
                      The desired image remains in spec; it is not copied into bounded status.
                    maxLength: 64
                    type: string
                required:
                - admittedAt
                - clusterID
                - hostedClusterUID
                - hostedClusterUpgradeUID
                - observedGeneration
                - planRevision
                - releaseRevision
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
