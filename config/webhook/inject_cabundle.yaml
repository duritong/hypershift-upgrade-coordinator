---
# Injects OpenShift Service CA annotation into webhook configuration.
# manifests.yaml is generated by controller-gen, so this patch preserves the annotation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
