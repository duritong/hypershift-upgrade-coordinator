---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-upgrade-0xshift-dev-v1alpha1-hostedclusterupgrade
  failurePolicy: Fail
  name: vhostedclusterupgrade.kb.io
  rules:
  - apiGroups:
    - upgrade.0xshift.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - hostedclusterupgrades
  sideEffects: None
