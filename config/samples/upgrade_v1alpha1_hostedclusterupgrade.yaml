apiVersion: upgrade.0xshift.dev/v1alpha1
kind: HostedClusterUpgrade
metadata:
  labels:
    app.kubernetes.io/name: hostedclusterupgrade
    app.kubernetes.io/instance: hostedclusterupgrade-sample
    app.kubernetes.io/part-of: huc
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: huc
  name: production-cluster-01
  namespace: default
spec:
  # The targeted final OpenShift version (Mandatory Tag + SHA Digest)
  targetReleaseImage: quay.io/openshift-release-dev/ocp-release:4.14.0-x86_64@sha256:e2c70fca183e380c6121a1c847806f11e839482123277235a8579db472b9ccf2

  # Optional EUS Intermediate release hop (Mandatory Tag + SHA Digest)
  intermediateReleaseImage: quay.io/openshift-release-dev/ocp-release:4.13.0-x86_64@sha256:74b23ed4bbb593195a721373ed6693687a9b444c97065ce8ac653ba464375711

  # Maintenance window schedule for the Hosted Control Plane
  controlPlane:
    startAt: "2026-08-15T02:00:00Z"

  # Rollout concurrency constraints
  rolloutPolicy:
    maxParallelNodePools: 2

  # Sequential, offset maintenance windows for worker NodePools
  nodePools:
    - name: infra-pool
      startAt: "2026-08-15T04:00:00Z"
    - name: workers-us-east-1a
      startAt: "2026-08-15T05:00:00Z"
    - name: workers-us-east-1b
      startAt: "2026-08-15T05:00:00Z"
