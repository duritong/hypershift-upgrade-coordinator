name: CI / CD Workflow

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Vendored Dependencies
        run: |
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor/

      - name: Run Unit and Integration Tests
        run: |
          make tests
          git diff --exit-code -- api/ config/
  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          skip-dirs: 'tmp,vendor'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Generate Image Metadata
        id: meta
        run: |
          SHA_TAG="quay.io/duritong/huc:${{ github.sha }}"
          TAGS="${SHA_TAG}"
          PUSH="false"
          CACHE_TO=""

          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master") ]]; then
            TAGS="${TAGS},quay.io/duritong/huc:latest"
            PUSH="true"
            CACHE_TO="type=gha,mode=max"
          fi

          {
            echo "tags=${TAGS}"
            echo "push=${PUSH}"
            echo "cache_to=${CACHE_TO}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to Quay.io
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build Container Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: ${{ steps.meta.outputs.cache_to }}
