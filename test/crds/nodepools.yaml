apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepools.hypershift.openshift.io
spec:
  group: hypershift.openshift.io
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                release:
                  type: object
                  properties:
                    image:
                      type: string
                pausedUntil:
                  type: string
            status:
              type: object
              properties:
                replicas:
                  type: integer
  scope: Namespaced
  names:
    plural: nodepools
    singular: nodepool
    kind: NodePool
